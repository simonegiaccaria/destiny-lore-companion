# ---------------------------------------------------------------------------
# Hand-curated release map. THIS FILE ENCODES EDITORIAL JUDGMENT, NOT API DATA.
# Verify every flag before trusting it — especially `vaulted`, which drives
# the "vaulted = known to everyone" spoiler policy, and `spoils`, which
# drives the pre-spoiler warning for vaulted lore that foreshadows content
# that is still playable.
#
# vaulted: true  -> content cannot be played anymore; its lore is treated as
#                   common knowledge for every user (project policy).
# spoils: [...]  -> releases whose playable story this content foreshadows.
#                   The Ghost warns before answering from these chunks when
#                   the user hasn't finished the spoiled release (Phase 2).
#
# NOTE: some vaulted releases had parts return to the game later (exotic
# missions, reprised activities). `vaulted` is per-release here; per-content
# overrides can be added under `overrides:` when we hit real cases.
# ---------------------------------------------------------------------------

releases:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lore Companion</title>
<style>
  /* Phase-1 utility UI. Identity: archive terminal lit by a Ghost —
     near-black blue, one cyan accent, monospace answers like a scan log. */
  :root{
    --bg:#0b0e14; --panel:#121826; --line:#1f2a3d;
    --ink:#c9d4e3; --dim:#7a8699; --ghost:#6fd3e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;
       min-height:100dvh}
  header{padding:.7rem 1rem;border-bottom:1px solid var(--line);
         display:flex;gap:1rem;align-items:baseline}
  header h1{font-size:1rem;margin:0;letter-spacing:.12em;
            text-transform:uppercase;color:var(--ghost)}
  header nav a{color:var(--dim);text-decoration:none;font-size:.85rem}
  header nav a.on{color:var(--ink)}
  main{flex:1;display:flex;flex-direction:column;max-width:52rem;
       width:100%;margin:0 auto;padding:0 .8rem}
  #log{flex:1;overflow-y:auto;padding:1rem 0}
  .msg{margin:.6rem 0;padding:.7rem .9rem;border-radius:10px;max-width:92%;
       white-space:pre-wrap}
  .you{background:var(--panel);margin-left:auto}
  .ghost{border:1px solid var(--line);border-left:3px solid var(--ghost);
         font-family:ui-monospace,monospace;font-size:.92rem}
  form{display:flex;gap:.5rem;padding:.8rem 0;position:sticky;bottom:0;
       background:var(--bg)}
  input{flex:1;background:var(--panel);border:1px solid var(--line);
        color:var(--ink);border-radius:10px;padding:.75rem .9rem;font:inherit}
  button{background:var(--ghost);color:#04222b;border:0;border-radius:10px;
         padding:0 1.1rem;font:inherit;font-weight:600}
  #books{display:none;padding:1rem 0}
  #books h2{color:var(--ghost);font-size:.95rem;letter-spacing:.08em}
  #books li{cursor:pointer;color:var(--dim);padding:.2rem 0}
  #books li:hover{color:var(--ink)}
  article h3{color:var(--ghost)} article p{white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>Lore Companion</h1>
  <nav>
    <a href="#" id="tab-chat" class="on">Ghost</a> ·
    <a href="#" id="tab-books">Archive</a>
  </nav>
</header>
<main>
  <div id="log"><div class="msg ghost">Eyes up, Guardian. Ask me anything.</div></div>
  <div id="books"><h2>Lore books</h2><ul id="booklist"></ul><div id="bookview"></div></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask your Ghost…">
    <button>Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log'),
      books = document.getElementById('books'),
      form = document.getElementById('f'),
      q = document.getElementById('q');
let history = [];

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  add('you', text);
  const el = add('ghost', '…');
  const res = await fetch('/chat', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question:text, history})});
  const reader = res.body.getReader(), dec = new TextDecoder();
  let full = '';
  el.textContent = '';
  for(;;){ const {done, value} = await reader.read(); if (done) break;
           full += dec.decode(value, {stream:true});
           el.textContent = full; log.scrollTop = log.scrollHeight; }
  history.push({role:'user',content:text},{role:'assistant',content:full});
};

function add(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

document.getElementById('tab-books').onclick = async (e) => {
  e.preventDefault(); swap(false);
  const r = await fetch('/api/books'); const data = await r.json();
  const ul = document.getElementById('booklist'); ul.innerHTML = '';
  data.books.forEach(b => { const li = document.createElement('li');
    li.textContent = b; li.onclick = () => openBook(b); ul.appendChild(li); });
};
document.getElementById('tab-chat').onclick = (e) => {e.preventDefault(); swap(true);};
function swap(chat){ log.style.display = chat ? 'block':'none';
  form.style.display = chat ? 'flex':'none';
  books.style.display = chat ? 'none':'block';
  document.getElementById('tab-chat').classList.toggle('on', chat);
  document.getElementById('tab-books').classList.toggle('on', !chat); }
async function openBook(name){
  const r = await fetch('/api/book/' + encodeURIComponent(name));
  const b = await r.json(); const v = document.getElementById('bookview');
  v.innerHTML = '';
  b.pages.forEach(p => { const a = document.createElement('article');
    const h = document.createElement('h3'); h.textContent = p.title;
    const t = document.createElement('p'); t.textContent = p.text;
    a.append(h, t); v.appendChild(a); });
}
</script>
</body>
</html>
